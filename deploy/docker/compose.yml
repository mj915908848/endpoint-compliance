# 终端合规管理端：PostgreSQL + 管理端。设置都在同目录的 .env 里（从 .env.example 复制），这个文件不用改。
name: compliance

# Container output is kept in rotated files: 3 × 10 MB per container, instead of one file that grows until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: ${DB_PASSWORD:?在 .env 中设置 DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    # Pulled from the registry, or loaded from a release's packaged image under the same name; compose.build.yml replaces it with a source build.
    # 固定版本：把 latest 改成版本号，如 0.2.26。
    image: ghcr.io/mj915908848/compliance-server:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:8443"
    # Certificate settings and any other server setting (proxy, retention, trusted gateway) come from .env.
    env_file: .env
    environment:
      Compliance__Database: Host=db;Database=compliance;Username=compliance
      PGPASSWORD: ${DB_PASSWORD}
      Compliance__BootstrapUsers: '[{"username":"${ADMIN_USER:-admin}","password":"${ADMIN_PASSWORD:?在 .env 中设置 ADMIN_PASSWORD}","roles":["Reader","Operator","Publisher"]}]'
      TZ: Asia/Shanghai
    volumes:
      - ./certs:/certs:ro
      - keys:/var/lib/compliance

volumes:
  db:
  keys:
