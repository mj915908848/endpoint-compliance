name: Release

# Run by hand (gh workflow run release.yml) to publish main's latest commit as a GitHub release v<VERSION>.<n>
# (n counts up from 0) with the Windows client package and the management server's Docker image (docker load -i).
# The commit's CI run must have passed.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: 确认版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 确认 CI 已通过
        run: |
          sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow CI --commit "$sha" --event push --json conclusion -q '.[0].conclusion // "none"')
          if [ "$state" != success ]; then echo "提交 $sha 的 CI 未通过（$state），不发布"; exit 1; fi
      - name: 版本号
        id: v
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          v=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import package; print(package.next_version())')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本 $v"

  # WiX builds MSIs on Windows only.
  msi:
    name: 客户端 MSI
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/package.py --version ${{ needs.version.outputs.version }} --msi
      - uses: actions/upload-artifact@v5
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error

  release:
    name: 发布版本
    needs: [version, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Windows 客户端包
        run: python3 scripts/package.py --version ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v5
        with:
          name: msi
          path: artifacts
      - name: Docker 镜像
        run: |
          v=${{ needs.version.outputs.version }}
          docker build -f deploy/docker/Dockerfile --build-arg VERSION=$v -t compliance-server:$v -t compliance-server:latest .
          docker run --rm --entrypoint sh compliance-server:$v -c 'test -f /app/wwwroot/index.html'
          docker save compliance-server:$v compliance-server:latest | gzip > artifacts/compliance-server-$v.tar.gz
      # One download for a new server: the deploy scripts and the image, run with ./install.sh after extracting.
      - name: 管理端一键部署包
        run: |
          v=${{ needs.version.outputs.version }}
          d=artifacts/deploy/compliance-server-$v
          mkdir -p $d
          cp deploy/docker/{compose.yml,.env.example,install.sh,backup.sh,README.md} $d/
          cp artifacts/compliance-server-$v.tar.gz $d/
          tar -C artifacts/deploy -czf artifacts/compliance-server-$v-deploy.tar.gz compliance-server-$v
          ls -lh artifacts/*.zip artifacts/*.msi artifacts/*.tar.gz
      - name: 发布
        run: |
          v=${{ needs.version.outputs.version }}
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## 改动"
            git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | head -50
            echo
            echo "## 安装与升级"
            echo "- 管理端首次部署：下载 \`compliance-server-$v-deploy.tar.gz\`，在装有 Docker 的 Linux 服务器上解压，进入目录运行 \`sudo ./install.sh --domain 管理端域名 --cert 证书.pem --key 私钥.key\`。"
            echo "- 管理端升级：下载 \`compliance-server-$v.tar.gz\`，放进服务器上的部署目录，运行 \`sudo ./install.sh\`（自动先备份再升级）。"
            echo "- 客户端（推荐）：双击 \`compliance-client-$v-windows-x64.msi\` 安装或升级，装完在弹出的窗口中填写管理端地址和登记码；升级保留登记。批量部署：\`msiexec /i compliance-client-$v-windows-x64.msi SERVERURL=https://管理端域名 CODE=登记码 /qn\`。"
            echo "- 客户端（脚本方式）：解压 \`compliance-client-$v-windows.zip\`，在已安装的电脑上双击“安装客户端（正式环境）.bat”，选“1 仅更新程序”。"
          } > notes.md
          gh release create "v$v" --target "$(git rev-parse HEAD)" --title "$v" --notes-file notes.md \
            "artifacts/compliance-client-$v-windows-x64.msi" \
            "artifacts/compliance-client-$v-windows.zip" "artifacts/compliance-server-$v.tar.gz" \
            "artifacts/compliance-server-$v-deploy.tar.gz"
