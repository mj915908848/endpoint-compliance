name: Release

# After CI passes on main, publishes a GitHub release v<VERSION>.<commit count> with the Windows client
# package and the management server's Docker image (docker load -i).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: 发布版本
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: 版本号
        id: v
        run: |
          v="$(cat VERSION).$(git rev-list --count HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
          echo "版本 $v"
      - uses: actions/setup-dotnet@v5
        if: steps.v.outputs.exists != 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Windows 客户端包
        if: steps.v.outputs.exists != 'true'
        run: python3 scripts/package.py
      - name: Docker 镜像
        if: steps.v.outputs.exists != 'true'
        run: |
          v=${{ steps.v.outputs.version }}
          docker build -f deploy/docker/Dockerfile --build-arg VERSION=$v -t compliance-server:$v -t compliance-server:latest .
          docker run --rm --entrypoint sh compliance-server:$v -c 'test -f /app/wwwroot/index.html'
          docker save compliance-server:$v compliance-server:latest | gzip > artifacts/compliance-server-$v.tar.gz
          ls -lh artifacts/*.zip artifacts/*.tar.gz
      - name: 发布
        if: steps.v.outputs.exists != 'true'
        run: |
          v=${{ steps.v.outputs.version }}
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## 改动"
            git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | head -50
            echo
            echo "## 升级"
            echo "- 管理端：下载 \`compliance-server-$v.tar.gz\`，在服务器上先 \`./backup.sh\`，再 \`docker load -i compliance-server-$v.tar.gz && docker compose up -d\`。"
            echo "- 客户端：解压 \`compliance-client-$v-windows.zip\`，在已安装的电脑上双击“安装客户端（正式环境）.bat”，选“1 仅更新程序”。"
          } > notes.md
          # GitHub drops non-ASCII characters from asset file names, so the client package gets an ASCII name.
          cp "artifacts/终端合规-$v-Windows客户端.zip" "artifacts/compliance-client-$v-windows.zip"
          gh release create "v$v" --target "$(git rev-parse HEAD)" --title "$v" --notes-file notes.md \
            "artifacts/compliance-client-$v-windows.zip#Windows 客户端 $v" \
            "artifacts/compliance-server-$v.tar.gz#管理端 Docker 镜像 $v"
