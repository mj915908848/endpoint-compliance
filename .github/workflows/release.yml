name: Release

# Run by hand (gh workflow run release.yml) to publish main's latest commit as a GitHub release v<VERSION>.<n>
# (n counts up from 0) with the Windows client MSI, and to push the management server's image to
# ghcr.io/mj915908848/compliance-server as <version> and latest.
# The commit's CI run must have passed.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: 确认版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 确认 CI 已通过
        run: |
          sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow CI --commit "$sha" --event push --json conclusion -q '.[0].conclusion // "none"')
          if [ "$state" != success ]; then echo "提交 $sha 的 CI 未通过（$state），不发布"; exit 1; fi
      - name: 版本号
        id: v
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          v=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import package; print(package.next_version())')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本 $v"

  # WiX builds MSIs on Windows only.
  msi:
    name: 客户端 MSI
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/package.py --version ${{ needs.version.outputs.version }} --msi
      - uses: actions/upload-artifact@v6
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error

  release:
    name: 发布版本
    needs: [version, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/mj915908848/compliance-server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: msi
          path: artifacts
      - name: Docker 镜像
        run: |
          v=${{ needs.version.outputs.version }}
          docker build -f deploy/docker/Dockerfile --build-arg VERSION=$v -t $IMAGE:$v -t $IMAGE:latest .
          docker run --rm --entrypoint sh $IMAGE:$v -c 'test -f /app/wwwroot/index.html'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # latest moves only once the release exists, so a failed release leaves servers on the previous version.
      - run: docker push $IMAGE:${{ needs.version.outputs.version }}
      - name: 发布
        run: |
          v=${{ needs.version.outputs.version }}
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## 改动"
            git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | head -50
            echo
            echo "## 安装与升级"
            echo "- 管理端镜像：\`$IMAGE:$v\`（也是 \`latest\`）。首次部署见 [deploy/docker/README.md](../../blob/v$v/deploy/docker/README.md)；升级在服务器的部署目录运行 \`./backup.sh && docker compose pull && docker compose up -d\`。"
            echo "- 客户端：双击 \`compliance-client-$v-windows-x64.msi\` 安装或升级，装完在弹出的窗口中填写管理端地址和登记码；升级保留登记。批量部署：\`msiexec /i compliance-client-$v-windows-x64.msi SERVERURL=https://管理端域名 CODE=登记码 /qn\`。"
          } > notes.md
          gh release create "v$v" --target "$(git rev-parse HEAD)" --title "$v" --notes-file notes.md \
            "artifacts/compliance-client-$v-windows-x64.msi"
      - run: docker push $IMAGE:latest
