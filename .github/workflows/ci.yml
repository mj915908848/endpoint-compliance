name: CI

on:
  # Other branches are checked by their pull request; running on their pushes too would test each change twice.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    # ready_for_review: a draft skips the Windows job, so marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides which jobs this change needs. A change to this workflow, or a manual run, runs everything.
  changes:
    name: 判断改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On a pull request the filter lists the changed files through the API, which needs read access to pull requests;
    # on main, finding the last passing run needs read access to actions.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ui: ${{ steps.f.outputs.ui == 'true' || steps.f.outputs.all == 'true' || github.event_name == 'workflow_dispatch' }}
      dotnet: ${{ steps.f.outputs.dotnet == 'true' || steps.f.outputs.all == 'true' || github.event_name == 'workflow_dispatch' }}
      e2e: ${{ steps.f.outputs.e2e == 'true' || steps.f.outputs.all == 'true' || github.event_name == 'workflow_dispatch' }}
      windows: ${{ steps.f.outputs.windows == 'true' || steps.f.outputs.all == 'true' || github.event_name == 'workflow_dispatch' }}
      docker: ${{ steps.f.outputs.docker == 'true' || steps.f.outputs.all == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # On main every push may be released, and a newer push cancels this run: compare with the last push
      # whose run passed, not the previous push, so a release is never cut from changes whose jobs were
      # skipped or cancelled. Before any run has passed, compare with the last release.
      - name: 上次通过的提交
        id: base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ref=
          for sha in $(gh run list --workflow CI --branch main --event push --status success --limit 20 --json headSha -q '.[].headSha'); do
            if [ "$sha" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then ref=$sha; break; fi
          done
          [ -n "$ref" ] || ref=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null)
          echo "比较基准 $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: f
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            all:
              - .github/**
              - global.json
              - Directory.Build.props
              - dotnet-tools.json
            ui:
              - ui/**
            dotnet:
              - src/**
              - tests/**
              - ui/openapi.json
            e2e:
              - ui/**
              - src/Compliance.Core/**
              - src/Compliance.Server/**
              - src/Compliance.Agent/**
              - integration/e2e.py
            # The server runs on Linux in Docker; the agent talking to it is covered by e2e.
            windows:
              - src/Compliance.Core/**
              - src/Compliance.Agent/**
              - src/Compliance.Tray/**
              - tests/Compliance.Agent.Tests/**
              - deploy/windows/**
              - scripts/package.py
              - integration/windows_smoke.py
            docker:
              - deploy/docker/**
              - .dockerignore
              - src/Compliance.Core/**
              - src/Compliance.Server/**
              - ui/package*.json

  format:
    name: 格式检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: dotnet tool restore
      - name: CSharpier
        run: dotnet csharpier check src tests
      - name: Prettier
        working-directory: ui
        run: |
          npm ci
          npm run format:check

  ui:
    name: 前端构建与测试
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run api
          git diff --exit-code src/api.gen.ts || (echo "::error::src/api.gen.ts is out of date with openapi.json: run npm run api in ui/ and commit it" && exit 1)
          npm run build
          npm test

  server:
    name: 服务端与 Core 测试（SQLite + PostgreSQL）
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build
        run: |
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
      - name: Core tests
        run: dotnet run --project tests/Compliance.Core.Tests
      - name: Server tests (SQLite)
        run: dotnet test tests/Compliance.Server.Tests
      - name: Server tests (PostgreSQL)
        run: dotnet test tests/Compliance.Server.Tests
        env:
          COMPLIANCE_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres

  e2e:
    name: 端到端测试
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build management UI, server and agent
        run: |
          (cd ui && npm ci && npm run build)
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
      - name: End-to-end
        run: python integration/e2e.py --data artifacts/e2e
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence
          path: artifacts/e2e
          if-no-files-found: ignore

  # Windows minutes bill double: a draft pull request skips this job until it is marked ready; main always runs it.
  windows:
    name: Windows 实机采集
    needs: changes
    if: needs.changes.outputs.windows == 'true' && !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash stops at the first failing command; PowerShell would only check the last one.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem deploy -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Agent tests (including native socket table)
        run: dotnet run --project tests/Compliance.Agent.Tests
      - name: Build management UI, server, agent and tray
        run: |
          cd ui
          npm ci
          npm run build
          cd ..
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
          dotnet build src/Compliance.Tray -c Release
      - name: Stage a client package and build the MSI
        run: python scripts/package.py --stage artifacts/pkg --msi
      - name: Download an earlier release to upgrade from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.1 -p 'compliance-client-*' -D artifacts/old-zip
          python -m zipfile -e artifacts/old-zip/*.zip artifacts/old-pkg
      - name: Native scan against a loopback server, then install the earlier release and upgrade it as a service
        run: python integration/windows_smoke.py --data artifacts/windows-smoke --package artifacts/pkg --old-package artifacts/old-pkg --msi "$(ls artifacts/compliance-client-*-windows-x64.msi)"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-scan
          path: artifacts/windows-smoke
          if-no-files-found: ignore

  docker:
    name: Docker 部署
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@v5
      # The one-step install: generates .env and a self-signed certificate, builds the image and waits until it answers.
      - name: 一键部署
        run: ./install.sh --domain ci.example.test --port 8443 --build
      - name: 登录、读取策略、重启后签名密钥不变、备份
        run: |
          set -e
          url=https://ci.example.test:8443
          check() {
            for i in $(seq 30); do
              curl -sk --resolve ci.example.test:8443:127.0.0.1 -o /dev/null "$url/" && break; sleep 2
            done
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 "$url/" | grep -q '<div id="root">'
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 -c jar -H 'Content-Type: application/json' \
              -d "{\"username\":\"admin\",\"password\":\"$(sed -n 's/^ADMIN_PASSWORD=//p' .env)\"}" "$url/api/auth/login" > /dev/null
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 -b jar "$url/api/policies" | grep -q '"isDefault":true'
          }
          check
          docker compose restart server
          check
          ./install.sh --build
          check
          test -s backups/*/compliance.dump && grep -q 'BEGIN EC PRIVATE KEY' backups/*/signing.key
      - if: failure()
        run: docker compose logs
