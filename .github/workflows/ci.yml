name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: 格式检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: dotnet tool restore
      - name: CSharpier
        run: dotnet csharpier check src tests
      - name: Prettier
        working-directory: ui
        run: |
          npm ci
          npm run format:check

  ui:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run build
          npm test

  server:
    name: 服务端与 Core 测试（SQLite + PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: |
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
      - name: Core tests
        run: dotnet run --project tests/Compliance.Core.Tests
      - name: Server tests (SQLite)
        run: dotnet test tests/Compliance.Server.Tests
      - name: Server tests (PostgreSQL)
        run: dotnet test tests/Compliance.Server.Tests
        env:
          COMPLIANCE_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres

  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build management UI, server and agent
        run: |
          (cd ui && npm ci && npm run build)
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
      - name: End-to-end
        run: python integration/e2e.py --data artifacts/e2e
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence
          path: artifacts/e2e
          if-no-files-found: ignore

  windows:
    name: Windows 实机采集
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash stops at the first failing command; PowerShell would only check the last one.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem deploy -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Agent tests (including native socket table)
        run: dotnet run --project tests/Compliance.Agent.Tests
      - name: Build management UI, server, agent and tray
        run: |
          cd ui
          npm ci
          npm run build
          cd ..
          dotnet build src/Compliance.Server -c Release
          dotnet build src/Compliance.Agent -c Release
          dotnet build src/Compliance.Tray -c Release
      - name: Stage a client package
        run: |
          dotnet publish src/Compliance.Agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/pkg/agent-windows-x64
          dotnet publish src/Compliance.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/pkg/agent-windows-x64
          mkdir -p artifacts/pkg/deploy
          cp -r deploy/windows artifacts/pkg/deploy/
      - name: Native scan against a loopback server, then install the package as a service
        run: python integration/windows_smoke.py --data artifacts/windows-smoke --package artifacts/pkg
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-scan
          path: artifacts/windows-smoke
          if-no-files-found: ignore

  docker:
    name: Docker 部署
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@v5
      - name: 自签证书和配置
        run: |
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=*.example.test" \
            -addext "subjectAltName=DNS:*.example.test" -keyout certs/key.pem -out certs/cert.pem
          sudo chown -R 1654:1654 certs && sudo chmod 600 certs/*
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci$(openssl rand -hex 12)/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password-1234/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/" .env
      - name: 构建并启动
        run: docker compose up -d --build --wait --wait-timeout 120 || (docker compose logs; exit 1)
      - name: 登录、读取策略、重启后签名密钥不变、备份
        run: |
          set -e
          url=https://ci.example.test:8443
          check() {
            for i in $(seq 30); do
              curl -sk --resolve ci.example.test:8443:127.0.0.1 -o /dev/null "$url/" && break; sleep 2
            done
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 "$url/" | grep -q '<div id="root">'
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 -c jar -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"ci-admin-password-1234"}' "$url/api/auth/login" > /dev/null
            curl -sfk --resolve ci.example.test:8443:127.0.0.1 -b jar "$url/api/policies" | grep -q '"isDefault":true'
          }
          check
          docker compose restart server
          check
          ./backup.sh
          test -s backups/*/compliance.dump && grep -q 'BEGIN EC PRIVATE KEY' backups/*/signing.key
      - if: failure()
        run: docker compose logs
